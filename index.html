<!DOCTYPE html>
<html lang="ja">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ハーブティーミニ図鑑</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>☕️ ハーブティーを選ぶ</h1>

    <p id="intro">気分や目的に合わせて、<br>
    今日の一杯を探して見てください。</p>

    <h2>🌿 ハーブを選んでください</h2>

    <select id="herbSelect">
        <option value="">🔍 ハーブ名から探す</option>
    </select>

    <p class="resultTitle">🌿 こんなハーブ</p>
    <p id="herbDescription"></p>

    <p class="resultTitle">📝 メモ</p>
    <p id="herbMemo"></p>

    <h2>☕️ どんな一杯をお探しですか？</h2>

    <select id="tagSelect">
        <option value="">🔍 目的から探す</option>  
    </select>

    <select id="foundHerbSelect">
        <option value="">ハーブを選んでください</option>
    </select>

    <p class="resultTitle">🌿 こんなハーブ</p>
    <p id="foundHerbDescription"></p>

    <p class="resultTitle">📝 メモ</p>
    <p id="foundHerbMemo"></p>

    <script src="script.js"></script>

</body>

</html>
